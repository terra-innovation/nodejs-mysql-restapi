server {
    listen 80;
    server_name localhost;
    root /opt/finanzatech/ft-app-frontend-mantis;
    index index.html;
    # Adaptador exclusivo del laboratorio: CORS de la aplicación sigue usando
    # el origen de producción. No certifica CORS/HTTPS externos ni cambia su código.
    location /backend/ {
        proxy_pass http://127.0.0.1:5000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP 127.0.0.1;
        proxy_set_header Origin https://app.finanzatech.com;
    }
    location / {
        try_files $uri $uri/ /index.html;
    }
    location ~* \.(js|css|map|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
        try_files $uri =404;
    }
}
