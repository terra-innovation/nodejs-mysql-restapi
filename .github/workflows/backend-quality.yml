name: Backend quality

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      format_base:
        description: Revision base para comprobar el formato de los cambios
        type: string
        default: HEAD^
        required: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  TZ: UTC

jobs:
  quality:
    name: Backend quality
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Select npm and verify runtime
        run: |
          npm install --global "$(node --print 'require("./package.json").packageManager')" --no-audit --no-fund
          node --version
          node --print process.execPath
          npm --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.versions.node, readFileSync('.node-version', 'utf8').trim());
          assert.equal(execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), pkg.packageManager.slice(4));
          NODE

      - name: Install locked dependencies
        id: install
        env:
          PRISMA_SKIP_POSTINSTALL_GENERATE: "true"
        run: npm ci --include=dev --no-audit --no-fund

      - name: Generate Prisma client
        id: prisma
        run: npm run prisma:generate:ci

      - name: Check types
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.prisma.outcome == 'success' }}
        run: npm run typecheck:all

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: npm run lint

      - name: Check changed files formatting
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        env:
          FORMAT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || inputs.format_base }}
        run: |
          if [[ -z "$FORMAT_BASE" || "$FORMAT_BASE" =~ ^0+$ ]]; then
            FORMAT_BASE="$(git rev-parse --verify HEAD^)"
          fi
          npm run format:changed -- --base "$FORMAT_BASE"

      - name: Jest quick tests
        id: jest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.prisma.outcome == 'success' }}
        timeout-minutes: 5
        env:
          LIQUIDACION_FRONTEND_ROOT: ${{ github.workspace }}/tests/fixtures/frontend-date-contract
        run: |
          node scripts/quality/verify-frontend-date-contract.mjs
          npm test -- --ci --runInBand

      - name: Vitest quick tests
        id: vitest
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.prisma.outcome == 'success' }}
        timeout-minutes: 5
        run: npm run test:vitest
