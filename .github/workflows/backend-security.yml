name: Backend security

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]
  schedule:
    # Lunes 10:17 America/Lima (UTC-5).
    - cron: "17 15 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          fail-on-scopes: runtime, development, unknown
          comment-summary-in-pr: never

  audit:
    name: Dependency audit
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Select npm and verify runtime
        run: |
          npm install --global "$(node --print 'require("./package.json").packageManager')" --no-audit --no-fund
          node --version
          node --print process.execPath
          npm --version
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const pkg = JSON.parse(readFileSync('package.json', 'utf8'));
          assert.equal(process.versions.node, readFileSync('.node-version', 'utf8').trim());
          assert.equal(execFileSync('npm', ['--version'], { encoding: 'utf8' }).trim(), pkg.packageManager.slice(4));
          NODE
      - name: Audit locked dependencies
        run: |
          mkdir -p coverage/security
          npm audit --package-lock-only --ignore-scripts --include=dev --audit-level=high --json > coverage/security/npm-audit.json
      - name: Upload audit report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: backend-security-${{ github.run_id }}-${{ github.run_attempt }}
          path: coverage/security/npm-audit.json
          if-no-files-found: error
          retention-days: 14
